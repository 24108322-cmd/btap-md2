<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Interactive Image Gallery</h1>

    <div id="image">
        Di chuột qua hình ảnh bên dưới để hiển thị tại đây.
    </div>

    <div class="gallery">
        <img class="preview"
             src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=600&q=80"
             alt="A cute dog">

        <img class="preview"
             src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80"
             alt="A cute cat">

        <img class="preview"
             src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=600&q=80"
             alt="A golden dog">
    </div>

    <script src="script.js"></script>
</body>
</html>
